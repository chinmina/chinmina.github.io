name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install tools with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install
      - name: Build site
        run: pnpm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  deploy-cloudflare:
    needs: build
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: cloudflare
      url: ${{ steps.cf-url.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install tools with mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install_args: node

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_DIRECTORY: .wrangler-output
          CF_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: pnpm wrangler pages deploy --branch="$CF_BRANCH"

      - name: Extract deployment URL
        id: cf-url
        if: always() && steps.deploy.outcome == 'success'
        run: |
          url=$(cat .wrangler-output/wrangler-output-*.json 2>/dev/null \
            | jq -r 'select(.type == "pages-deploy-detailed") | .url // empty' \
            | head -1)
          echo "value=${url}" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRANGLER_OUTPUT_FILE_DIRECTORY: .wrangler-output
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/cloudflare-deploy.sh comment

