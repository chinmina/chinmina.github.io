# Platform-specific optional packages provide these binaries. Do not run their
# postinstall fallback downloads; fail when the required package is unavailable.
allowBuilds:
  esbuild: false
  workerd: false

# astro2tsx loads its WASM module via @napi-rs/wasm-runtime, which takes
# @emnapi/runtime as a peer. astro2tsx pins @emnapi/core but omits the runtime,
# so pnpm resolves the peer to an incompatible 2.0.0-beta from elsewhere in the
# graph and `astro check` crashes on load. Remove once upstream declares it.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": "1.11.3"
